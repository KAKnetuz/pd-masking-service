services:
  api:
    build: .
    ports:
      - "80:8000"
    env_file:
      - path: .env
        required: false
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKERS: ${WORKERS:-4}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    sysctls:
      net.core.somaxconn: 4096
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  redis:
    image: redis:7-alpine
    # Только оперативная память: ПД не сохраняются на диск, записи живут TTL.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb",
              "--maxmemory-policy", "volatile-ttl"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
